<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어휘력 100</title>
    <style>
        :root {
            --bg-color: #eef2f5;
            --card-bg: #ffffff;
            --primary: #4a90e2;
            --text-main: #333333;
            --text-sub: #666666;
            --option-bg: #f8f9fa;
            --option-border: #eeeeee;
            --success: #2ecc71;
            --danger: #ff6b6b;
        }
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: 0.3s;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
            transition: all 0.3s ease;
        }
        .main-title { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
        .question-box { font-size: 1.3rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; text-align: left; min-height: 50px; word-break: keep-all; }
        .option-item { font-size: 1rem; padding: 16px; background: var(--option-bg); border: 2px solid var(--option-border); border-radius: 12px; cursor: pointer; transition: all 0.2s; text-align: left; }
        .explanation-box { font-size: 0.9rem; color: var(--text-sub); margin-top: 8px; line-height: 1.5; border-top: 1px solid var(--option-border); padding-top: 8px; word-break: keep-all; }
        .footer-btn { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: calc(100% - 40px); max-width: 460px; padding: 18px; 
            border-radius: 50px; border: none; background: var(--primary); color: white; 
            font-weight: bold; font-size: 1.1rem; cursor: pointer; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.2); z-index: 100;
            transition: max-width 0.3s ease, width 0.3s ease;
        }

        @media (min-width: 800px) {
            .container { max-width: 850px !important; }
            .card { padding: 40px 40px !important; border-radius: 24px !important; }
            .main-title { font-size: 2.8rem !important; margin-bottom: 20px !important; }
            .question-box { font-size: 1.8rem !important; margin-bottom: 30px !important; line-height: 1.4 !important; }
            .option-item { font-size: 1.25rem !important; padding: 18px 25px !important; border-radius: 16px !important; }
            .explanation-box { font-size: 1.1rem !important; margin-top: 10px !important; }
            .footer-btn { max-width: 750px !important; font-size: 1.4rem !important; padding: 20px !important; border-radius: 50px !important; bottom: 30px !important; }
            .header-btn { font-size: 1rem !important; padding: 10px 16px !important; }
            .q-cat, .user-tag { font-size: 1.1rem !important; }
            .progress-info { font-size: 1.1rem !important; margin-top: 8px !important; }
            .options-list { gap: 12px !important; }
            .zoom-select { font-size: 1rem !important; padding: 6px 12px !important; }
        }

        .hidden { display: none !important; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; }
        .header-btn { border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-end { background: var(--text-sub); color: white; }
        .btn-review { background: var(--danger); color: white; margin-right: 5px; }
        .zoom-select { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--primary); color: var(--primary); font-weight: bold; background: white; outline: none; cursor: pointer; font-size: 0.9rem; }
        .card { background: var(--card-bg); padding: 30px 20px; border-radius: 20px; text-align: center; border: 1px solid var(--option-border); box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-top: 0; }
        .quiz-header { margin-bottom: 15px; border-bottom: 1px solid var(--option-border); padding-bottom: 10px; }
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .q-cat { font-size: 0.8rem; background: var(--option-border); padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        .user-tag { color: var(--text-sub); font-size: 0.9rem; }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-sub); font-weight: bold; margin-top: 5px; }
        .progress-bar-bg { width: 100%; height: 6px; background: var(--option-border); border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }
        .options-list { display: grid; gap: 10px; }
        .option-item.correct { border-color: var(--success) !important; background: rgba(46, 204, 113, 0.15); }
        .option-item.wrong { border-color: var(--danger) !important; background: rgba(255, 107, 107, 0.15); }
        .option-item.dimmed { opacity: 0.6; border-color: var(--option-border); }
        .feedback-row { display: flex; align-items: center; margin-top: 8px; font-weight: bold; }
        .quiz-content-area { padding-bottom: 100px; }
        .sub-btn { background: var(--option-bg); border: 1px solid var(--option-border); color: var(--text-main); padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 80%; }
        .badge { background: var(--danger); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container" id="app-container">
    <div class="top-bar">
        <div id="quiz-controls" class="hidden">
            <button class="header-btn btn-end" onclick="app.endStudy()">그만하기</button>
            <button id="btn-to-review" class="header-btn btn-review hidden" onclick="app.switchToReview()">오답 복습</button>
            <button id="btn-exit-review" class="header-btn btn-end hidden" onclick="app.exitReview()">복습 종료</button>
        </div>
        <div style="flex-grow: 1;"></div>
        <select id="zoom-select" class="zoom-select" onchange="app.setZoom(this.value)">
            <option value="0.5">50%</option>
            <option value="0.6">60%</option>
            <option value="0.7">70%</option>
            <option value="0.8">80%</option>
            <option value="0.9">90%</option>
            <option value="1" selected>100%</option>
            <option value="1.1">110%</option>
            <option value="1.2">120%</option>
            <option value="1.3">130%</option>
            <option value="1.4">140%</option>
            <option value="1.5">150%</option>
        </select>
    </div>

    <div id="screen-start" class="card">
        <div class="main-title">📚 어휘력 100</div>
        <p style="color: var(--text-sub);">속담, 관용구, 고사성어</p>
        <input type="text" id="user-name" placeholder="이름을 입력하세요" style="width:80%; padding:15px; border-radius:10px; border:1px solid var(--option-border); background:var(--option-bg); color:var(--text-main); margin:20px 0; text-align:center;">
        <br>
        <button onclick="app.init('normal')" style="padding:15px 50px; border-radius:12px; border:none; background:var(--primary); color:white; font-weight:bold; cursor:pointer; width:80%;">시작하기</button>
        <button id="review-btn-start" class="sub-btn hidden" onclick="app.init('review')" style="margin-top:15px;">오답 복습하기 <span id="start-badge" class="badge">0</span></button>
    </div>

    <div id="screen-quiz" class="hidden quiz-content-area">
        <div class="quiz-header">
            <div class="info-row">
                <span id="q-cat" class="q-cat">속담</span>
                <span id="user-tag" class="user-tag"></span>
            </div>
            <div class="progress-info">
                <span id="progress-text-solved">푼 문제: 0</span>
                <span id="progress-text-remain">남은 문제: 100</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-bar-fill" class="progress-bar-fill"></div>
            </div>
        </div>
        <div id="review-tag" style="color:var(--danger); font-size:0.9rem; font-weight:bold; margin-bottom:15px; text-align:center;" class="hidden">⚠️ 오답 복습 모드 (맞히면 사라져요!)</div>
        <div class="question-box" id="q-text"></div>
        <div id="options" class="options-list"></div>
        <button id="next-btn" class="footer-btn hidden" onclick="app.next()">다음 문제로 👉</button>
    </div>

    <div id="screen-result" class="card hidden">
        <h1 id="result-title" style="color:var(--success);">수고했어요!</h1>
        <div style="font-size:3rem; font-weight:900; margin: 20px 0;" id="final-score">0 / 100</div>
        <p id="result-msg" style="margin-bottom:30px; color:var(--text-sub); line-height:1.6;"></p>
        <button id="review-btn-result" class="sub-btn hidden" onclick="app.init('review')" style="background:var(--danger); color:white; border:none; margin-bottom:10px; width:100%;">틀린 문제 복습하기</button>
        <button onclick="location.reload()" style="width:80%; padding:12px; border-radius:10px; border:none; background:var(--primary); color:white; font-weight:bold; cursor:pointer;">처음으로</button>
    </div>
</div>

<script>
    const database = [
        {c:"속담", q:"상대방이 나에게 잘해야 나도 상대방에게 잘한다는 뜻", a:"가는 말이 고와야 오는 말이 곱다", d:"친절한 말을 먼저 건네야 상대방도 친절하게 대한다는 교훈입니다."},
        {c:"속담", q:"일이 이미 잘못된 뒤에 손을 써도 소용없다는 뜻", a:"소 잃고 외양간 고친다", d:"평소 대비하지 않고 문제가 생긴 뒤에야 후회하는 상황을 비유합니다."},
        {c:"속담", q:"형편이 나아진 뒤에 지난날의 어려움을 잊는다는 뜻", a:"개구리 올챙이 적 생각 못 한다", d:"성공한 사람이 과거의 힘들었던 시절을 잊고 거만하게 행동함을 비꼬는 말입니다."},
        {c:"속담", q:"어릴 때 배운 나쁜 습관은 늙어서도 고치기 어렵다는 뜻", a:"세 살 버릇 여든까지 간다", d:"어릴 때 형성된 습관은 평생 가기 때문에 처음에 잘 배워야 함을 강조합니다."},
        {c:"속담", q:"작은 것이라도 계속 모으면 나중에 큰 것이 된다는 뜻", a:"티끌 모아 태산", d:"아무리 작은 노력이라도 꾸준히 모으면 큰 결실을 맺을 수 있다는 뜻입니다."},
        {c:"속담", q:"쉬운 일이라도 서로 힘을 합치면 훨씬 쉽다는 뜻", a:"백지장도 맞들면 낫다", d:"가벼운 종이 한 장이라도 함께 들면 더 쉽듯이 협동의 중요성을 강조합니다."},
        {c:"속담", q:"적당한 것이 없을 때 그와 비슷한 것으로 대신함", a:"꿩 대신 닭", d:"원래 원하던 것이 없을 때 비슷한 수준의 다른 것으로 대신함을 뜻합니다."},
        {c:"속담", q:"잘 아는 일이라도 세심하게 주의를 기울여야 함", a:"돌다리도 두들겨 보고 건너라", d:"확실하고 잘 아는 일도 실수 없도록 꼼꼼하게 다시 확인하라는 지혜입니다."},
        {c:"속담", q:"가까운 곳에서 일어난 일을 오히려 모를 때", a:"등잔 밑이 어둡다", d:"정작 자신과 가장 가까운 곳에서 벌어지는 일을 모르는 상황을 비유합니다."},
        {c:"속담", q:"매우 하기 쉬운 일을 비유하는 말", a:"땅 짚고 헤엄치기", d:"이미 성공이 보장되어 있거나 너무나 쉬워서 실패할 리 없는 매우 쉬운 일입니다."},
        {c:"속담", q:"뜻밖에 당하는 불행이나 사고", a:"마른하늘에 날벼락", d:"전혀 예상하지 못한 상황에서 갑자기 닥친 큰 불행을 뜻합니다."},
        {c:"속담", q:"어차피 당할 일이라면 남보다 먼저 당하는 것이 나음", a:"매도 먼저 맞는 게 낫다", d:"피할 수 없는 어려운 일이라면 일찍 겪는 게 마음 편하다는 뜻입니다."},
        {c:"속담", q:"작은 나쁜 짓도 자꾸 하면 큰 죄를 짓게 됨", a:"바늘 도둑이 소도둑 된다", d:"작은 잘못을 가볍게 여기면 나중에 큰 범죄를 저지를 수 있다는 경고입니다."},
        {c:"속담", q:"주가 되는 것보다 부차적인 것이 더 크거나 많음", a:"배보다 배꼽이 더 크다", d:"기본적인 것보다 부수적인 수고가 더 많이 들어가는 상황을 말합니다."},
        {c:"속담", q:"매우 하기 쉬운 일을 이르는 말", a:"식은 죽 먹기", d:"아무런 노력 없이도 쉽게 해낼 수 있는 일을 뜻합니다."},
        {c:"속담", q:"원인이 없으면 결과가 있을 수 없다는 뜻", a:"아니 땐 굴뚝에 연기 날까", d:"결과가 생기는 데에는 반드시 그럴만한 이유가 있음을 뜻합니다."},
        {c:"속담", q:"걱정하던 일이 해결되어 아주 시원한 상태", a:"앓던 이가 빠진 것 같다", d:"오랫동안 괴롭히던 고민거리가 해결되어 아주 후련할 때 씁니다."},
        {c:"속담", q:"못난 사람이 자기 편의 명예를 더럽힘", a:"어물전 망신은 꼴뚜기가 시킨다", d:"집단 내 질이 떨어지는 사람이 전체의 체면을 깎아내리는 상황입니다."},
        {c:"속담", q:"아무리 어려운 일이라도 정성을 다하면 이루어짐", a:"열 번 찍어 안 넘어가는 나무 없다", d:"꾸준히 노력하면 아무리 어려운 목표라도 결국 달성할 수 있다는 끈기의 표현입니다."},
        {c:"속담", q:"안 될 일은 아예 처음부터 바라지도 말라는 뜻", a:"오르지 못할 나무는 쳐다보지도 마라", d:"자기 능력 밖의 일에 지나친 욕심을 내지 말고 분수를 지키라는 교훈입니다."},
        {c:"속담", q:"세상 형편을 넓게 알지 못하는 사람", a:"우물 안 개구리", d:"좁은 범위 안에서만 생각하며 넓은 세상의 변화를 모르는 사람입니다."},
        {c:"속담", q:"좋게 대하는 사람에게는 나쁘게 대할 수 없음", a:"웃는 낯에 침 못 뱉는다", d:"상대방이 나에게 친절하게 대하면 화를 내기 어렵다는 뜻입니다."},
        {c:"속담", q:"익숙한 일이라도 실수할 때가 있다는 뜻", a:"원숭이도 나무에서 떨어진다", d:"아무리 실력이 뛰어난 전문가라도 가끔은 실수할 수 있음을 뜻합니다."},
        {c:"속담", q:"윗사람이 바른 행동을 해야 아랫사람도 바르게 행동한다는 뜻", a:"윗물이 맑아야 아랫물이 맑다", d:"윗사람이 바른 행동을 해야 아랫사람도 본받는다는 사회적 교훈입니다."},
        {c:"속담", q:"한 번 놀란 일과 비슷한 것만 봐도 겁을 냄", a:"자라 보고 놀란 가슴 솥뚜껑 보고 놀란다", d:"어떤 일에 크게 놀란 적이 있는 사람은 비슷한 것만 봐도 겁을 먹게 됩니다."},
        {c:"속담", q:"몸집은 작아도 재주가 뛰어나거나 힘이 센 사람", a:"작은 고추가 맵다", d:"겉으로 보기엔 작고 약해 보여도 실제로는 아주 야무진 경우를 뜻합니다."},
        {c:"속담", q:"엉뚱한 곳에서 화풀이를 함을 이르는 말", a:"종로에서 뺨 맞고 한강에서 눈 흘긴다", d:"자기가 해를 입은 곳에서는 말 못 하다 엉뚱한 곳에서 화풀이하는 상황입니다."},
        {c:"속담", q:"무슨 일이든 시작이 중요하다는 뜻", a:"천 리 길도 한 걸음부터", d:"아무리 큰 계획이라도 당장 눈앞의 작은 첫걸음부터 시작된다는 뜻입니다."},
        {c:"속담", q:"무식해서 용감하거나 철없이 행동함", a:"하룻강아지 범 무서운 줄 모른다", d:"세상 물정을 모르고 무서운 대상을 몰라봐 무모하게 덤비는 사람을 뜻합니다."},
        {c:"속담", q:"아무리 큰 어려움에 처해도 살아날 길은 있음", a:"하늘이 무너져도 솟아날 구멍이 있다", d:"절망적인 상황에서도 포기하지 않으면 해결책이 보인다는 격려입니다."},
        {c:"속담", q:"매우 쉽고 편안하게 할 수 있는 일", a:"누워서 떡 먹기", d:"힘을 들이지 않고 거저 얻는 수준의 아주 쉬운 일을 뜻합니다."},
        {c:"속담", q:"마음먹었을 때 망설이지 말고 바로 행동함", a:"쇠뿔도 단김에 빼라", d:"좋은 기회가 왔을 때 미루지 말고 즉시 처리해야 성공 확률이 높다는 뜻입니다."},
        {c:"속담", q:"해줄 사람은 생각도 않는데 미리 기대함", a:"떡 줄 사람은 생각도 않는데 김칫국부터 마신다", d:"상대방의 의중도 모르면서 혼자 성급한 기대를 하는 상황을 비유합니다."},

            this.state.name = nameInput;

            const saved = localStorage.getItem(`vocab_kword1_${nameInput}`);
            if(saved) {
                const data = JSON.parse(saved);
                this.state.wrongPool = data.wrongPool || [];

            }

            if(mode === 'review') {

                this.state.questions = this.shuffle([...this.state.wrongPool]);
                this.state.mode = 'review';
                this.state.idx = 0;
                this.setupScreen('review');
            } else {
                const remaining = database.filter(item => !this.state.completedList.includes(item.a));
                if (this.state.completedList.length > 0 && remaining.length > 0) {
                    if(!confirm(`${nameInput}님, 지난 학습을 이어서 할까요?`)) {
                        this.state.completedList = []; this.state.score = 0;
                        this.state.questions = this.shuffle([...database]);
                    } else { this.state.questions = this.shuffle(remaining); }

                    if(confirm("모든 문제를 다 풀었습니다! 처음부터 다시 할까요?")) {
                        this.state.completedList = []; this.state.score = 0;

                    } else return;
                } else { this.state.questions = this.shuffle([...database]); }

                this.state.mode = 'normal'; this.state.idx = 0;

            this.render();
        },
        setZoom: function(val) { document.body.style.zoom = val; },
        setupScreen: function(mode) {
            document.getElementById('quiz-controls').classList.remove('hidden');
            if(mode === 'review') {
                document.getElementById('review-tag').classList.remove('hidden');
                document.getElementById('btn-to-review').classList.add('hidden');
                document.getElementById('btn-exit-review').classList.remove('hidden');
            } else {
                document.getElementById('review-tag').classList.add('hidden');
                document.getElementById('btn-to-review').classList.remove('hidden');
                document.getElementById('btn-exit-review').classList.add('hidden');
            }
        },
        render: function() {
            const q = this.state.questions[this.state.idx];
            this.state.answered = false;
            let solvedCount = this.state.mode === 'normal' ? this.state.completedList.length : this.state.idx;
            let remainingCount = this.state.mode === 'normal' ? database.length - solvedCount : this.state.questions.length - this.state.idx;
            
            document.getElementById('progress-text-solved').innerText = `완료: ${solvedCount}개`;
            document.getElementById('progress-text-remain').innerText = `남음: ${remainingCount}개`;
            document.getElementById('progress-bar-fill').style.width = `${(solvedCount / (this.state.mode==='normal'?database.length:this.state.questions.length)) * 100}%`;
            document.getElementById('q-cat').innerText = q.c;
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('next-btn').classList.add('hidden');
            
            const optCont = document.getElementById('options'); optCont.innerHTML = '';
            const options = this.shuffle([q.a, ...this.getWrongOptions(q.a)]);
            options.forEach((txt, i) => {
                const item = document.createElement('div'); item.className = 'option-item';
                item.innerHTML = `<strong>${String.fromCharCode(65 + i)}.</strong> ${txt}`;
                item.dataset.val = txt; item.onclick = () => this.check(item, txt, q);
                optCont.appendChild(item);
            });
        },
        getWrongOptions: function(correct) { return this.shuffle(database.filter(d => d.a !== correct).map(d => d.a)).slice(0, 3); },
        check: function(selectedEl, selectedVal, currentQ) {
            if(this.state.answered) return;
            this.state.answered = true;
            const isCorrect = selectedVal === currentQ.a;
            
            if(isCorrect) {
                if(this.state.mode === 'normal') { this.state.score++; this.state.completedList.push(currentQ.a); } 
                else { this.state.wrongPool = this.state.wrongPool.filter(item => item.a !== currentQ.a); }
            } else {
                if(this.state.mode === 'normal') {
                    this.state.completedList.push(currentQ.a);
                    if(!this.state.wrongPool.some(item => item.a === currentQ.a)) this.state.wrongPool.push(currentQ);
                }
            }
            
            document.querySelectorAll('.option-item').forEach(el => {
                const val = el.dataset.val; const data = database.find(item => item.a === val);
                const isItemCorrect = val === currentQ.a; const isItemSelected = el === selectedEl;

                if (isItemCorrect) el.classList.add('correct');
                else if (isItemSelected && !isCorrect) el.classList.add('wrong');
                else el.classList.add('dimmed');

                let feedbackHtml = `<div class="explanation-box">${data ? data.d : ""}</div>`;
                if (isItemCorrect) feedbackHtml = `<div class="feedback-row"><span style="color:var(--success)">✓ 정답</span></div>` + feedbackHtml;
                else if (isItemSelected) feedbackHtml = `<div class="feedback-row"><span style="color:var(--danger)">× 오답</span></div>` + feedbackHtml;
                el.innerHTML += feedbackHtml;
            });
            document.getElementById('next-btn').classList.remove('hidden');
            this.save();
        },
        endStudy: function() { if(confirm("학습을 여기서 그만하고 결과를 볼까요?")) this.result(true); },
        switchToReview: function() {
            if(this.state.wrongPool.length === 0) return alert("복습할 오답이 없습니다!");
            if(confirm("오답 복습 모드로 전환할까요?")) { this.state.lastNormalIdx = this.state.idx; this.init('review'); }
        },
        exitReview: function() { if(confirm("복습을 마치고 원래 학습으로 돌아가시겠습니까?")) this.init('normal'); },
        next: function() {
            this.state.idx++;
            if (this.state.mode === 'review' && this.state.idx >= this.state.questions.length) {
                alert("🎉 오답을 모두 해결했습니다!\n원래 학습으로 돌아갑니다."); this.init('normal'); return;
            }
            if(this.state.idx < this.state.questions.length) this.render(); else this.result();
        },
        result: function(isManualEnd = false) {
            this.showScreen('screen-result');
            const reviewBtn = document.getElementById('review-btn-result');
            if (isManualEnd) {
                document.getElementById('result-title').innerText = "학습 종료";
                document.getElementById('final-score').innerText = `${this.state.completedList.length} / 100`;
                document.getElementById('result-msg').innerText = "오늘 학습을 마쳤습니다.";
                reviewBtn.classList.add('hidden');
            } else {
                if(this.state.mode === 'normal') {
                    document.getElementById('result-title').innerText = "완주 성공!";
                    document.getElementById('final-score').innerText = `${this.state.score} / 100`;
                    document.getElementById('result-msg').innerText = "모든 문제를 다 풀었습니다.";
                } else {
                    document.getElementById('result-title').innerText = "복습 완료";
                    document.getElementById('final-score').innerText = "";
                    document.getElementById('result-msg').innerText = `남은 오답이 없습니다!`;
                }
                if(this.state.wrongPool.length > 0) reviewBtn.classList.remove('hidden'); else reviewBtn.classList.add('hidden');
            }
        },
        save: function() {
            localStorage.setItem(`vocab_kword1_${this.state.name}`, JSON.stringify({
                wrongPool: this.state.wrongPool, completedList: this.state.completedList, score: this.state.score
            }));
            this.updateBadges();
        },
        updateBadges: function() {
            const count = this.state.wrongPool.length;
            const badge = document.getElementById('start-badge'); const btn = document.getElementById('review-btn-start');
            if(count > 0) { badge.innerText = count; btn.classList.remove('hidden'); } else { btn.classList.add('hidden'); }
        },
        showScreen: function(id) {
            ['screen-start', 'screen-quiz', 'screen-result'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if (id === 'screen-quiz') document.getElementById('quiz-controls').classList.remove('hidden');
            else document.getElementById('quiz-controls').classList.add('hidden');
        },
        shuffle: function(arr) { return arr.sort(() => Math.random() - 0.5); }
    };

    window.onload = () => {
        document.body.style.zoom = "1";
        const nameInput = document.getElementById('user-name');
        nameInput.oninput = () => {
            const saved = localStorage.getItem(`vocab_kword1_${nameInput.value.trim()}`);
            if(saved) {
                const data = JSON.parse(saved);
                if(data.wrongPool && data.wrongPool.length > 0) {
                    document.getElementById('review-btn-start').classList.remove('hidden');
                    document.getElementById('start-badge').innerText = data.wrongPool.length;
                }
            } else { document.getElementById('review-btn-start').classList.add('hidden'); }
        };
    };
</script>
</body>
</html>
